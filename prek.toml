# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    # Lockfiles are generated and must be committed, whatever their size.
    { id = "check-added-large-files", exclude = '(^|/)(uv\.lock|package-lock\.json)$' },
]

[[repos]]
repo = "local"

# The uv project lives in backend/, not the repo root.
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run --directory backend ruff check --fix"
language = "system"
files = '^backend/.*\.py$'
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --directory backend ruff format"
language = "system"
files = '^backend/.*\.py$'
pass_filenames = false

[[repos.hooks]]
id = "sqlfluff-fix"
name = "sqlfluff fix"
entry = "uv run --directory backend sqlfluff fix app/sql"
language = "system"
files = '^backend/.*\.sql$'
pass_filenames = false

[[repos.hooks]]
id = "sqlfluff-lint"
name = "sqlfluff lint"
entry = "uv run --directory backend sqlfluff lint app/sql"
language = "system"
files = '^backend/.*\.sql$'
pass_filenames = false
