# The golden set: 15 templates, 77 cases.
#
# The agent answers about the network the graph draws, so the ground truth follows the graph's
# rules too: the case's filters are the graph's filters, and a pair counts only if it shares at
# least the graph's floor of baskets (30 out of all the data, the same share of a filter's own
# baskets, never fewer than 5). `prelude` builds that network from the raw invoice table. It is
# written here from the rule, not taken from the app's queries, so a bug there cannot pass its
# own test. `evals/build.py` runs each case and freezes the answers into golden.json.
#
# SQL parameters: %(segment)s and %(days)s are the case's filters (null: no filter), the rest are
# its fills. What a template's SQL returns decides what is expected:
#   item        -> expected_items          a, b  -> expected_pairs
#   text        -> expected_text: words the answer must contain (a product's name)
#   the columns in `asked` -> expected_figures, one per row
# `asked` is the figures an answer must state: the measure the question is about. Any other figure
# is the agent's choice to state, and is checked against its own ledger instead.
#
# `filters` is what the graph shows when the question is asked. A question can name another scope:
#   scope     the question names this segment or period instead; the answer is for it, and the
#             graph switches to it
#   compare   the question compares these two scopes; the answer covers both, and the graph splits
#
# A trap has one right answer: that it cannot be answered from the graph, with no figures.
#   missing     the question names a product type that is not in the data. The agent may only
#               say so after looking the name up, so find_item is expected
#   hidden      the pair exists but is too rare for the graph (fills a, b)
#   no_segment  the question names a customer segment that does not exist
#
# `find: true` on a case: the question's words are not the data's, so find_item is expected
# before the template's own tool.
#
# `kind: open` is a question with no single right answer: what differs between two scopes, which
# combinations could grow. There is no ground-truth SQL. The answer must be about the expected
# scopes, name only what the expected tool returned, and the expected tool must be called.

prelude: |
  WITH scoped AS (
    SELECT inv_num, item_tag, item_name, amount FROM invoice
    WHERE (%(segment)s::TEXT IS NULL OR segment = %(segment)s)
      AND (%(days)s::INT IS NULL
        OR datetime >= (SELECT MAX(datetime) FROM invoice) - MAKE_INTERVAL(days => %(days)s))
  ),
  lines AS (SELECT DISTINCT inv_num, item_tag FROM scoped),
  orders AS (SELECT item_tag, COUNT(*) AS n FROM lines GROUP BY 1),
  baskets AS (SELECT COUNT(DISTINCT inv_num) AS n FROM lines),
  cutoff AS (
    SELECT GREATEST(5, ROUND(
      30.0 * (SELECT n FROM baskets) / (SELECT COUNT(DISTINCT inv_num) FROM invoice)
    )) AS n
  ),
  pairs AS (
    SELECT x.item_tag AS a, y.item_tag AS b, COUNT(*)::INT AS co_orders,
           ROUND(COUNT(*) * (SELECT n FROM baskets)::NUMERIC / (MAX(ox.n) * MAX(oy.n)), 3)::FLOAT
             AS lift
    FROM lines x
    JOIN lines y ON x.inv_num = y.inv_num AND x.item_tag < y.item_tag
    JOIN orders ox ON ox.item_tag = x.item_tag
    JOIN orders oy ON oy.item_tag = y.item_tag
    GROUP BY 1, 2
    HAVING COUNT(*) >= (SELECT n FROM cutoff)
  )

# What a group's revenue is added up from, for the templates about groups.
revenue: SELECT item_tag AS item, SUM(amount)::INT AS revenue FROM scoped GROUP BY 1

templates:
  1:
    name: top 5 product types by revenue
    catches: invented_ranking # also: ranking by orders instead of revenue
    tool: {name: top_items, args: {by: revenue}}
    sql: |
      SELECT item_tag AS item, SUM(amount)::INT AS revenue
      FROM scoped GROUP BY 1 ORDER BY revenue DESC, item LIMIT 5

  2:
    name: the pair bought together most often
    catches: best_sellers_as_pair
    tool: {name: top_pairs, args: {by: co_orders}}
    sql: SELECT a, b, co_orders FROM pairs ORDER BY co_orders DESC, a, b LIMIT 1

  3:
    name: the pair with the highest lift
    catches: wrong_lift_ranking # also: ranking by shared baskets instead of lift
    tool: {name: top_pairs, args: {by: lift}}
    asked: [lift]
    sql: SELECT a, b, co_orders, lift FROM pairs ORDER BY lift DESC, a, b LIMIT 1

  4:
    name: what is bought most with a product type
    catches: wrong_partner
    tool: {name: item_neighbors, args: {by: co_orders}}
    sql: |
      SELECT CASE WHEN a = %(item)s THEN b ELSE a END AS item, co_orders
      FROM pairs WHERE %(item)s IN (a, b)
      ORDER BY co_orders DESC, item LIMIT 1

  7:
    name: the product type that connects the most others
    catches: best_seller_as_hub
    tool: {name: central_items, args: {by: betweenness}}
    # The SQL gives the graph's pairs above chance; the build finds the type with the highest
    # betweenness on them with NetworkX.
    derive: betweenness
    sql: SELECT a, b FROM pairs WHERE lift > 1 ORDER BY a, b

  8:
    name: the group that earns the most
    catches: wrong_group_sum # also: made-up groups, or the biggest group instead of the richest
    tool: {name: communities, args: {}}
    # The SQL gives the graph's pairs above chance, strongest first; the build groups them with
    # Louvain (seed 42, as the graph does) and adds up each group's revenue.
    derive: top_group
    sql: SELECT a, b, lift FROM pairs WHERE lift > 1 ORDER BY lift DESC, a, b

  9:
    name: are two product types bought together more than chance predicts
    catches: popular_is_not_paired
    tool: {name: pair_stats, args: {}}
    asked: [lift] # the evidence for the yes or no
    sql: |
      SELECT a, b, co_orders, lift FROM pairs
      WHERE a = LEAST(%(a)s::TEXT, %(b)s::TEXT) AND b = GREATEST(%(a)s::TEXT, %(b)s::TEXT)

  11:
    name: the best-selling product inside a product type
    catches: product_not_in_brief # also: naming the type instead of a product
    tool: {name: item_products, args: {}}
    asked: [orders]
    sql: |
      SELECT item_name AS text, COUNT(DISTINCT inv_num)::INT AS orders
      FROM scoped WHERE item_tag = %(item)s
      GROUP BY 1 ORDER BY orders DESC, text LIMIT 1

  12:
    name: which product types share a group with one
    catches: made_up_group
    tool: {name: communities, args: {}, fills: false}
    derive: group_of
    sql: SELECT a, b, lift FROM pairs WHERE lift > 1 ORDER BY lift DESC, a, b

  14:
    name: what is bought most with a product type, under two scopes
    catches: one_scope_for_both # also: mixing the two sides up
    # Template 4's question asked of each scope: the answer names each side's top partner.
    # `compare` does not return a type's partners, so the path is template 4's tool, once for
    # each side.
    tool: {name: item_neighbors, args: {by: co_orders}}
    sql: |
      SELECT CASE WHEN a = %(item)s THEN b ELSE a END AS item, co_orders
      FROM pairs WHERE %(item)s IN (a, b)
      ORDER BY co_orders DESC, item LIMIT 1

  15:
    name: the three product types bought together most often
    catches: pair_logic_for_a_set # also: a group with three members instead of a set of three
    tool: {name: top_bundles, args: {by: co_orders}}
    # A set counts when each two of its three are a pair on the graph, and it is in at least
    # half the baskets a pair needs (never fewer than 5).
    derive: bundle
    sql: |
      SELECT x.item_tag AS a, y.item_tag AS b, z.item_tag AS c, COUNT(*)::INT AS co_orders
      FROM lines x
      JOIN lines y ON x.inv_num = y.inv_num AND x.item_tag < y.item_tag
      JOIN lines z ON y.inv_num = z.inv_num AND y.item_tag < z.item_tag
      WHERE (x.item_tag, y.item_tag) IN (SELECT a, b FROM pairs)
        AND (y.item_tag, z.item_tag) IN (SELECT a, b FROM pairs)
        AND (x.item_tag, z.item_tag) IN (SELECT a, b FROM pairs)
      GROUP BY 1, 2, 3
      HAVING COUNT(*) >= GREATEST(5, FLOOR((SELECT n FROM cutoff) / 2))
      ORDER BY co_orders DESC, a, b, c LIMIT 2

  16:
    name: what differs between two scopes
    catches: one_lookup_per_side # also: describing one side only
    # An open comparison is what `compare` is for: its two sides are the case's `compare`.
    tool: {name: compare, args: {}}

  17:
    name: combinations that could grow, by the partners two types share
    catches: proven_pair_as_potential # also: a forecast instead of a candidate to test
    tool: {name: potential_pairs, args: {method: shared_partners}}

  18:
    name: combinations one segment buys together far more than customers overall
    catches: proven_pair_as_potential
    tool: {name: potential_pairs, args: {method: segment_gap}}

  13:
    name: top 5 product types by orders
    catches: revenue_as_orders
    tool: {name: top_items, args: {by: orders}}
    sql: |
      SELECT item_tag AS item, COUNT(*)::INT AS orders
      FROM lines GROUP BY 1 ORDER BY orders DESC, item LIMIT 5

